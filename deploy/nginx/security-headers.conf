# Заголовки безопасности для Проблемомера. Подключаются командой `include` внутри каждого блока location
# (nginx не наследует add_header во вложенный location, если там задан свой add_header).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Политика в режиме наблюдения (Report-Only): ничего не блокирует, нарушения видны в консоли браузера.
# Проверена на сборке выпуска: нарушений нет. Источники: mc.yandex.ru — Метрика (только при заданном VITE_YM_ID),
# script.google.com / script.googleusercontent.com — приёмник аналитики (только при заданном VITE_ANALYTICS_INGEST_URL).
# Если приёмник аналитики на другом адресе, добавьте его в connect-src.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru; font-src 'self' data:; connect-src 'self' https://mc.yandex.ru https://script.google.com https://script.googleusercontent.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' https://mc.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
