# Проблемомер на https://stp-multiframe.ru/problemomer/
#
# Вставьте содержимое в блок server { ... } сайта stp-multiframe.ru (который уже слушает 443 с сертификатом).
# Пути поправьте под свой сервер. Предполагается:
#   /var/www/stp-multiframe.ru/problemomer  — ссылка на текущий выпуск (её переключает deploy/install-release.sh)
#   /etc/nginx/snippets/problemomer-security-headers.conf — копия файла deploy/nginx/security-headers.conf
#
# Корень сайта (root) общий для всего сайта: nginx сам добавляет к нему путь /problemomer/... и идёт по ссылке.

location = /problemomer { return 301 /problemomer/; }

# Страницы и служебные файлы: браузер каждый раз сверяет версию (быстрый ответ 304, если не менялось).
location /problemomer/ {
    root /var/www/stp-multiframe.ru;
    index index.html;
    try_files $uri $uri/ /problemomer/index.html;
    add_header Cache-Control "no-cache" always;
    include snippets/problemomer-security-headers.conf;
}

# Файлы с хешем в имени можно кэшировать надолго.
location /problemomer/assets/ {
    root /var/www/stp-multiframe.ru;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/problemomer-security-headers.conf;
}

# Звуки и картинки: сутки.
location ~ ^/problemomer/(audio|images)/ {
    root /var/www/stp-multiframe.ru;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    include snippets/problemomer-security-headers.conf;
}

# Сервис-воркер и манифест должны проверяться заново при каждом заходе, иначе обновления доходят с задержкой.
location ~ ^/problemomer/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest|version\.txt)$ {
    root /var/www/stp-multiframe.ru;
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include snippets/problemomer-security-headers.conf;
}
