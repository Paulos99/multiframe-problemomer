name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc -b

      - name: Тесты
        run: npm test

      - name: Контрольные точки акустики
        run: npm run check:acoustic

      - name: Сборка для stp-multiframe.ru/problemomer/
        run: npm run build

      - name: Проверка адресов в сборке
        run: |
          grep -q 'href="https://stp-multiframe.ru/problemomer/"' dist/index.html
          grep -q '"scope":"/problemomer/"' dist/manifest.webmanifest
          ! grep -rq 'multiframe-problemomer' dist

      - name: Архив для выкладки
        uses: actions/upload-artifact@v4
        with:
          name: problemomer-dist
          path: dist
          retention-days: 14
