name: Выпуск (по метке vX.Y.Z)

# Срабатывает, когда владелец ставит метку выпуска, например v1.0.0.
# Повторно проверяет код, собирает статику под боевой адрес https://stp-multiframe.ru/problemomer/
# и прикладывает к выпуску на GitHub архив problemomer-<метка>.zip и файл контрольной суммы.
# Команда, размещающая сайт, берёт этот архив (deploy/install-release.sh) и код не правит.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Метка должна лежать на ветке main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Метка ${GITHUB_REF_NAME} не входит в ветку main. Выпуск отменён." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc -b

      - name: Тесты
        run: npm test

      - name: Контрольные точки акустики
        run: npm run check:acoustic

      - name: Сборка для stp-multiframe.ru/problemomer/
        env:
          # Адрес и путь по умолчанию — боевые (см. vite.config.ts).
          # Счётчик и приёмник аналитики — БОЕВЫЕ, из отдельных секретов репозитория (у стенда свои: VITE_YM_ID и т. д.).
          VITE_YM_ID: ${{ secrets.PROD_VITE_YM_ID }}
          VITE_ANALYTICS_INGEST_URL: ${{ secrets.PROD_VITE_ANALYTICS_INGEST_URL }}
        run: npm run build

      - name: Проверка адресов в сборке
        run: |
          grep -q 'href="https://stp-multiframe.ru/problemomer/"' dist/index.html
          grep -q '"scope":"/problemomer/"' dist/manifest.webmanifest
          ! grep -rq 'multiframe-problemomer' dist
          test -f dist/privacy.html

      - name: Архив выпуска
        run: |
          echo "${GITHUB_REF_NAME}" > dist/version.txt
          cd dist
          zip -qr "../problemomer-${GITHUB_REF_NAME}.zip" .
          cd ..
          sha256sum "problemomer-${GITHUB_REF_NAME}.zip" > "problemomer-${GITHUB_REF_NAME}.zip.sha256"
          cat "problemomer-${GITHUB_REF_NAME}.zip.sha256"

      - name: Публикация выпуска на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "problemomer-${GITHUB_REF_NAME}.zip" \
            "problemomer-${GITHUB_REF_NAME}.zip.sha256" \
            --title "Проблемомер ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
