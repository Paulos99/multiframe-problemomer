name: Deploy to GitHub Pages (проверочный стенд)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        env:
          # Проверочный стенд живёт в подпапке GitHub Pages; боевой адрес собирается по умолчанию (см. docs/DEPLOY.md)
          VITE_BASE_PATH: /multiframe-problemomer/
          VITE_SITE_URL: https://paulos99.github.io/multiframe-problemomer/
          VITE_YM_ID: ${{ secrets.VITE_YM_ID }}
          VITE_ANALYTICS_INGEST_URL: ${{ secrets.VITE_ANALYTICS_INGEST_URL }}
        run: npm ci && npm run build

      # enablement: true — first run creates Pages site with build_type=workflow
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages (проверочный стенд)
        id: deployment
        uses: actions/deploy-pages@v4
